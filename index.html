<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Paper Trail</title>
<meta name="description" content="Name the player from the clubs he played for. Football and basketball.">
<meta name="theme-color" content="#0B0B0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

<!-- Home -->
<main id="home" class="screen">
  <header class="top"><span class="logo" data-logo></span><span class="live">LIVE</span></header>

  <section class="headline"><h1>Name the<br>player.</h1><p>You get his clubs. You get three guesses.</p></section>

  <section class="who">
    <label class="bar" for="name"><span class="tag">NAME</span><input id="name" autocomplete="off" maxlength="20" placeholder="TYPE YOUR NAME"></label>
    <div id="profiles" class="profiles"></div>
  </section>

  <section class="sports">
    <button class="sport football" data-sport="football">
      <span class="sport-name">Football</span>
      <span class="sport-sub" data-sub="football"></span>
      <span class="flagband"></span>
    </button>
    <button class="sport basketball" data-sport="basketball">
      <span class="sport-name">Basketball</span>
      <span class="sport-sub" data-sub="basketball"></span>
    </button>
  </section>

  <section class="board" id="board" hidden>
    <h2>Standings</h2>
    <table id="board-table"></table>
  </section>

  <footer class="foot">CAREERS UP TO THE 2025-26 SEASON · LOGOS FROM ESPN</footer>
</main>

<!-- Game -->
<main id="game" class="screen" hidden>
  <header class="top">
    <button class="back" id="back" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></button>
    <span class="logo" data-logo></span><span class="live">LIVE</span>
  </header>
  <section class="strip"><h1>Who's<br>this?</h1><div class="count" id="g-count"></div></section>
  <div class="flagband"></div>
  <section class="score"><div id="g-player"></div><div>PTS<b id="g-score">0</b></div><div>RUN<b id="g-streak">0</b></div></section>
  <ol id="path" class="list"></ol>
  <p id="hint" class="hint" hidden></p>

  <div class="dock" id="answer">
    <ul id="suggest" class="suggest" hidden></ul>
    <div class="miss"><span id="wrong"></span><span class="lives" id="lives"></span><button id="btn-skip">GIVE UP</button></div>
    <div class="bar"><span class="tag">GUESS</span><input id="guess" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="TYPE A NAME"><button class="hint-btn" id="btn-hint">HINT<br>−30</button></div>
    <div class="ticker"><span id="ticker"></span></div>
  </div>

  <div class="dock result" id="result" hidden>
    <p class="verdict" id="verdict"></p>
    <h3 id="reveal"></h3>
    <p class="meta" id="reveal-meta"></p>
    <button class="next" id="btn-next"><span class="tag">NEXT</span><span>NEXT PLAYER</span></button>
  </div>
</main>

</div>
<script src="players.js"></script>
<script src="clubs.js"></script>
<script src="app.js"></script>
</body>
</html>
