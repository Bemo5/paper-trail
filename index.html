<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Paper Trail</title>
<meta name="description" content="Name the player from the clubs he played for. Football and basketball.">
<meta name="theme-color" content="#111111">
<!-- Bump ?v= on every deploy so a phone never mixes a new page with old cached files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23009C3B%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2218%22 font-family=%22Arial Black,Arial%22 font-weight=%22900%22 fill=%22%23FFDF00%22 text-anchor=%22middle%22%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<!-- Home -->
<main id="home" class="screen">
  <header class="top"><span class="title">PAPER <i>TRAIL</i></span></header>
  <div class="stripe"></div>

  <div class="home-body">
    <p class="lead">You get a player's clubs in order. Name him in three guesses.</p>

    <label class="label" for="name">Your name</label>
    <input id="name" class="field-input" autocomplete="off" maxlength="20" placeholder="Type your name">
    <div id="profiles" class="profiles"></div>

    <div class="sports">
      <button class="sport football" data-sport="football"><span class="sport-name">FOOTBALL</span><span class="sport-sub" data-sub="football"></span></button>
      <button class="sport basketball" data-sport="basketball"><span class="sport-name">BASKETBALL</span><span class="sport-sub" data-sub="basketball"></span></button>
    </div>

    <section class="board" id="board" hidden>
      <h2>Scores on this phone</h2>
      <table id="board-table"></table>
    </section>
  </div>

  <footer class="foot">Careers up to the 2025-26 season. Logos from ESPN.</footer>
</main>

<!-- Game -->
<main id="game" class="screen" hidden>
  <header class="top">
    <button class="back" id="back" aria-label="Home">‹</button>
    <span class="title">PAPER <i>TRAIL</i></span>
    <span class="pts" id="g-pts"></span>
  </header>
  <div class="stripe"></div>

  <div class="q"><h1>Who's this?</h1><span id="g-count"></span></div>
  <div class="grid-wrap"><ol id="grid" class="grid"></ol><p id="hint" class="hint" hidden></p></div>

  <div class="ans" id="answer">
    <div id="chips" class="chips" hidden></div>
    <div class="meta">
      <span class="dots" id="dots"></span><span id="wrong"></span>
      <span class="links"><button id="btn-hint">Hint</button><button id="btn-skip">Give up</button></span>
    </div>
    <form class="field" id="guess-form" autocomplete="off">
      <input id="guess" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" placeholder="Type a player…">
      <button class="go" type="submit">GUESS</button>
    </form>
  </div>

  <div class="ans result" id="result" hidden>
    <p class="verdict" id="verdict"></p>
    <h2 id="reveal"></h2>
    <p class="reveal-meta" id="reveal-meta"></p>
    <button class="next" id="btn-next">NEXT PLAYER</button>
  </div>
</main>

<script src="players.js?v=4"></script>
<script src="clubs.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
